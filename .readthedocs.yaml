version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # The version comes from the git tag via setuptools-scm, and Read the Docs
      # clones shallowly, so without this the build reports 0.1.dev1.
      - git fetch --unshallow || true
      - git fetch --tags || true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

mkdocs:
  configuration: mkdocs.yml
