name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest

      - name: Run Ruff Lint
        run: uv run --python ${{ matrix.python-version }} --extra dev ruff check .

      - name: Run Ruff Format Check
        run: uv run --python ${{ matrix.python-version }} --extra dev ruff format --check .

      - name: Run mypy
        run: uv run --python ${{ matrix.python-version }} --extra dev mypy pwnv

      - name: Build package
        run: uv build
