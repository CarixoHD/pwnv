[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"


[project]
name = "pwnv"
dynamic = ["version"]
description = "CLI tool for CTF management"
readme = "README.md"
license = "MIT"
authors = [
  {name = "Shayan Alinejad", email = "shayan.alinejad@proton.me"}
]
keywords = ["ctf", "pwn", "rev", "management", "cli", "ctfd", "rctf", "tool", "workspace", "automation", "workflow", "challenges"]
requires-python = ">=3.12"
dependencies = [
    # Imported directly, to resolve the config directory without typer.
    "click>=8.0",
    "ctfbridge>=0.8.10",
    "filelock>=3.18.0",
    "inquirerpy>=0.3.4",
    "pydantic>=2.10.3",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "typer>=0.15.1",
]

[dependency-groups]
dev = [
  "mypy",
  "ruff",
  "pre-commit",
  "pytest",
]

[project.optional-dependencies]
# An extra rather than a dependency group: Read the Docs installs the project
# with pip, which understands extras but not PEP 735 groups.
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/CarixoHD/pwnv/"
Documentation = "https://pwnv.readthedocs.io"
Repository = "https://github.com/CarixoHD/pwnv/"
Issues = "https://github.com/CarixoHD/pwnv/issues"
Changelog = "https://github.com/CarixoHD/pwnv/releases"

[tool.ruff]
# Bundled templates are rendered, not imported; they hold placeholders.
exclude = ["pwnv/examples/templates"]

[tool.ruff.lint]
select = ["F", "E", "I"]
ignore = ["F403", "F405"]

[project.scripts]
pwnv = "pwnv:main"


[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
pwnv = ["examples/**/*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.mypy]
# Templates are rendered into challenge directories, not imported; they refer to
# names that only exist after `from pwn import *` runs in the CTF environment.
exclude = ["pwnv/examples/templates/"]

[[tool.mypy.overrides]]
# pwntools lives in the CTF environment `pwnv init` builds, not in the
# development environment, so scaffolded solve scripts import it at run time.
module = ["pwn"]
ignore_missing_imports = true

[tool.codespell]
skip = "*.lock,*.json,./site,./.git,./docs/reference/cli.md"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
