site_name: pwnv
site_description: A CTF workspace manager for the command line
site_author: Shayan Alinejad
site_url: https://pwnv.readthedocs.io/
repo_url: https://github.com/CarixoHD/pwnv
repo_name: CarixoHD/pwnv
copyright: Copyright © 2026 Shayan Alinejad

theme:
  name: material
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tabs
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    logo: material/flag-triangle
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CarixoHD/pwnv
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pwnv/

nav:
  - 🚀 Getting Started:
      - 🗺️ Overview: index.md
      - 📦 Installation: getting-started/installation.md
      - ⚡ Quickstart: getting-started/quickstart.md
      - 🗂️ Workspace Layout: getting-started/workspace.md
  - 📘 User Guide:
      - 🎯 Challenges: guide/challenges.md
      - 🌐 Remote Platforms: guide/remote.md
      - 🧭 Navigation: guide/navigation.md
      - 🔌 Plugins and Templates: guide/plugins.md
      - 🤖 Scripting and Automation: guide/automation.md
      - 💾 Backup and Moving: guide/backup.md
  - 📚 Reference:
      - ⌨️ Commands: reference/cli.md
      - 🎒 The challenge object: api/challenge.md
      - 🧾 JSON payloads: api/json.md
  - 🛠️ Developer Guide:
      - 🗺️ Contributing: dev/index.md
      - 🧪 Testing: dev/testing.md
      - 🚢 Releasing: dev/release.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            heading_level: 3
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            show_bases: false
            members_order: source
            docstring_style: sphinx
